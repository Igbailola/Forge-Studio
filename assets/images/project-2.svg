<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F0" />
      <stop offset="100%" stop-color="#F3EADF" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p2Grad)" />
  <!-- E-commerce Layout -->
  <g transform="translate(60, 40)">
    <!-- Header -->
    <rect x="0" y="0" width="480" height="40" rx="8" fill="#1A1A1A" />
    <text x="24" y="25" font-family="serif" font-size="16" font-weight="bold" fill="#FFFFFF" letter-spacing="2">LUXE</text>
    <rect x="360" y="14" width="90" height="12" rx="6" fill="#FF4D00" />
    
    <!-- Product Grid -->
    <g transform="translate(0, 60)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="145" height="220" rx="8" fill="#FFFFFF" stroke="#E5D9CC" />
      <rect x="15" y="15" width="115" height="130" rx="4" fill="#E8DFD5" />
      <text x="15" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">Silk Evening Gown</text>
      <text x="15" y="185" font-family="sans-serif" font-size="12" color="#FF4D00" fill="#FF4D00">$1,290</text>
      
      <!-- Item 2 -->
      <rect x="165" y="0" width="145" height="220" rx="8" fill="#FFFFFF" stroke="#E5D9CC" />
      <rect x="180" y="15" width="115" height="130" rx="4" fill="#DFD6CB" />
      <text x="180" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">Leather Handbag</text>
      <text x="180" y="185" font-family="sans-serif" font-size="12" fill="#FF4D00">$850</text>

      <!-- Item 3 -->
      <rect x="330" y="0" width="150" height="220" rx="8" fill="#FFFFFF" stroke="#E5D9CC" />
      <rect x="345" y="15" width="120" height="130" rx="4" fill="#D6CCC0" />
      <text x="345" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A">Classic Trench</text>
      <text x="345" y="185" font-family="sans-serif" font-size="12" fill="#FF4D00">$1,450</text>
    </g>
  </g>
</svg>
