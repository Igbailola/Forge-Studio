<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="p1Card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D00" />
      <stop offset="100%" stop-color="#FF8A5C" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p1Grad)" />
  <!-- Credit Card / Banking App Preview -->
  <g transform="translate(150, 60)">
    <rect x="0" y="0" width="300" height="180" rx="16" fill="url(#p1Card)" opacity="0.9" />
    <circle cx="240" cy="50" r="24" fill="rgba(255,255,255,0.2)" />
    <circle cx="260" cy="50" r="24" fill="rgba(255,255,255,0.2)" />
    <text x="30" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">NOVA PREMIUM</text>
    <text x="30" y="120" font-family="monospace" font-size="16" letter-spacing="3" fill="#FFFFFF">•••• •••• •••• 8842</text>
    <text x="30" y="150" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">VAL/THRU 12/28</text>
    <text x="210" y="150" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">SARAH CHEN</text>
  </g>
  <!-- App Mockup below -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="400" height="160" rx="12" fill="#1F2937" stroke="rgba(255,255,255,0.1)" />
    <rect x="20" y="24" width="160" height="14" rx="7" fill="rgba(255,255,255,0.2)" />
    <rect x="20" y="50" width="100" height="24" rx="6" fill="#FF4D00" />
    <text x="35" y="66" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Send Money</text>
    <rect x="130" y="50" width="100" height="24" rx="6" fill="rgba(255,255,255,0.1)" />
    <text x="150" y="66" font-family="sans-serif" font-size="11" fill="#FFFFFF">Analytics</text>
    
    <!-- Transaction items -->
    <rect x="20" y="94" width="360" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
    <rect x="20" y="120" width="360" height="18" rx="4" fill="rgba(255,255,255,0.05)" />
  </g>
</svg>
