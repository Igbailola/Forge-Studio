<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F" />
      <stop offset="50%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#0F0F0F" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D00" />
      <stop offset="100%" stop-color="#FF8A5C" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF4D00" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid Lines -->
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Glowing Abstract Spheres -->
  <circle cx="680" cy="120" r="140" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="120" cy="480" r="180" fill="#FF4D00" opacity="0.08" filter="url(#glow)" />

  <!-- Main App Mockup Window -->
  <g filter="url(#shadow)">
    <rect x="120" y="80" width="560" height="420" rx="16" fill="#141416" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect x="120" y="80" width="560" height="44" rx="16" fill="#1E1E22" />
    <rect x="120" y="108" width="560" height="16" fill="#1E1E22" />
    <circle cx="150" cy="102" r="6" fill="#FF5F56" />
    <circle cx="170" cy="102" r="6" fill="#FFBD2E" />
    <circle cx="190" cy="102" r="6" fill="#27C93F" />
    <rect x="230" y="93" width="240" height="18" rx="9" fill="rgba(255,255,255,0.06)" />
    <text x="350" y="106" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">forgestudio.com/app/analytics</text>

    <!-- Sidebar Menu -->
    <rect x="140" y="144" width="120" height="336" rx="8" fill="rgba(255,255,255,0.02)" />
    <rect x="156" y="164" width="88" height="10" rx="5" fill="url(#accentGrad)" />
    <rect x="156" y="194" width="68" height="8" rx="4" fill="rgba(255,255,255,0.3)" />
    <rect x="156" y="218" width="76" height="8" rx="4" fill="rgba(255,255,255,0.15)" />
    <rect x="156" y="242" width="60" height="8" rx="4" fill="rgba(255,255,255,0.15)" />
    <rect x="156" y="266" width="72" height="8" rx="4" fill="rgba(255,255,255,0.15)" />

    <!-- Main Dashboard Area -->
    <!-- Metric Cards Row -->
    <g transform="translate(276, 144)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="118" height="72" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="14" y="26" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Total Revenue</text>
      <text x="14" y="52" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">$84,250</text>

      <!-- Card 2 -->
      <rect x="130" y="0" width="118" height="72" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="144" y="26" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Active Users</text>
      <text x="144" y="52" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FF4D00">+12.4k</text>

      <!-- Card 3 -->
      <rect x="260" y="0" width="124" height="72" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="274" y="26" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Conversion Rate</text>
      <text x="274" y="52" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">4.85%</text>
    </g>

    <!-- Main Analytics Wave Chart -->
    <g transform="translate(276, 236)">
      <rect x="0" y="0" width="384" height="224" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      
      <!-- Chart grid lines -->
      <line x1="20" y1="40" x2="364" y2="40" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4" />
      <line x1="20" y1="90" x2="364" y2="90" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4" />
      <line x1="20" y1="140" x2="364" y2="140" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4,4" />

      <!-- Glowing Chart Path Area -->
      <path d="M 20,160 Q 80,120 130,135 T 240,60 T 364,30 L 364,180 L 20,180 Z" fill="url(#accentGrad)" opacity="0.25" />
      <path d="M 20,160 Q 80,120 130,135 T 240,60 T 364,30" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" filter="url(#glow)" />

      <!-- Data Dots -->
      <circle cx="240" cy="60" r="5" fill="#FFFFFF" stroke="#FF4D00" stroke-width="3" />
      <circle cx="364" cy="30" r="5" fill="#FFFFFF" stroke="#FF4D00" stroke-width="3" />
    </g>
  </g>

  <!-- Floating Mobile Mockup Card -->
  <g transform="translate(560, 260)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="280" rx="20" fill="#0A0A0C" stroke="rgba(255,77,0,0.4)" stroke-width="2" />
    <!-- Screen content -->
    <rect x="12" y="24" width="156" height="232" rx="14" fill="#141418" />
    <rect x="24" y="44" width="80" height="10" rx="5" fill="url(#accentGrad)" />
    <circle cx="140" cy="49" r="12" fill="rgba(255,255,255,0.1)" />

    <!-- Mini chart inside mobile mockup -->
    <rect x="24" y="74" width="132" height="70" rx="8" fill="rgba(255,77,0,0.1)" />
    <path d="M 32,124 L 60,104 L 90,114 L 120,88 L 144,96" fill="none" stroke="#FF4D00" stroke-width="2" />

    <!-- List items -->
    <rect x="24" y="160" width="132" height="24" rx="6" fill="rgba(255,255,255,0.05)" />
    <rect x="24" y="192" width="132" height="24" rx="6" fill="rgba(255,255,255,0.05)" />
    <rect x="24" y="224" width="132" height="24" rx="6" fill="rgba(255,255,255,0.05)" />
  </g>
</svg>
