<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="chartGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF4D00" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p3Grad)" />
  
  <!-- Dashboard UI -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="500" height="320" rx="12" fill="#1E293B" stroke="rgba(255,255,255,0.1)" />
    
    <!-- Top bar -->
    <rect x="20" y="20" width="140" height="12" rx="6" fill="#FF4D00" />
    <circle cx="450" cy="26" r="12" fill="rgba(255,255,255,0.1)" />

    <!-- Bar chart preview -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="220" height="220" rx="8" fill="rgba(255,255,255,0.03)" />
      <!-- Bars -->
      <rect x="20" y="100" width="18" height="100" rx="4" fill="#38BDF8" />
      <rect x="50" y="60" width="18" height="140" rx="4" fill="#FF4D00" />
      <rect x="80" y="120" width="18" height="80" rx="4" fill="#38BDF8" />
      <rect x="110" y="40" width="18" height="160" rx="4" fill="#FF4D00" />
      <rect x="140" y="90" width="18" height="110" rx="4" fill="#38BDF8" />
      <rect x="170" y="20" width="18" height="180" rx="4" fill="#FF4D00" />
    </g>

    <!-- Area chart preview -->
    <g transform="translate(260, 60)">
      <rect x="0" y="0" width="220" height="220" rx="8" fill="rgba(255,255,255,0.03)" />
      <path d="M 10,180 Q 50,80 100,120 T 210,40 L 210,200 L 10,200 Z" fill="url(#chartGrad3)" />
      <path d="M 10,180 Q 50,80 100,120 T 210,40" fill="none" stroke="#FF4D00" stroke-width="3" />
    </g>
  </g>
</svg>
